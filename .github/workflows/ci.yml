name: ci

on:
  pull_request:
  # No push trigger: a merge here lands the tree the pull request already checked,
  # since `check` is required on a head up to date with main. Run this by hand to
  # check main after a merge that bypassed the gate (#223).
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
