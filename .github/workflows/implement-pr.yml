# Reusable: address review feedback on a PR labeled agent:implement.
# Called from a target repo's thin factory workflow on `pull_request_target: labeled`.
# Vendored from sandcastle's agent-implement-pr.yml (v0.12.0), edited for the factory.
name: factory implement-pr

on:
  workflow_call:
    inputs:
      implementer_model:
        description: Default model for the implementer. A model:<name> label on the PR overrides it for that run.
        type: string
        default: claude-opus-5
      per_account_slots:
        description: Runs in flight per account. Implemented as this many named concurrency slots; raise it here, no code change.
        type: number
        default: 3
      factory_repo:
        description: Repo holding the factory scripts (this repo).
        type: string
        default: chizhangucb/software-factory
      factory_ref:
        description: Ref of the factory scripts to run. Keep it equal to the ref in the caller's `uses:`; GitHub does not expose that ref to the called workflow.
        type: string
        default: main
    secrets:
      FACTORY_PAT:
        required: true

jobs:
  refuse-fork:
    # pull_request_target runs with secrets: the factory never runs a fork's code. Say so on the PR
    # and drop the trigger label, instead of skipping in silence.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LABEL: agent:implement
    steps:
      - run: |
          gh pr edit "$PR_NUMBER" --remove-label "$LABEL" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run: the factory does not run on PRs from forks (\`$LABEL\` removed). Push the branch to this repo instead."

  slot:
    # Per-account concurrency cap (#17): N named slots, account-slot-0 .. account-slot-(N-1), shared by
    # implement, review, and implement-pr in the target repo. A run takes slot (number mod N), so
    # every run on one issue or PR lands in the same slot and stays serialized. Runs fill accounts
    # in configured order and rotate only on a rate limit, so N slots caps runs in flight on the
    # account in use. GitHub's concurrency key has no arithmetic, hence this job.
    # Trade-off: a concurrency group holds one running and one pending run; a third run arriving
    # for the same slot cancels the older pending one before it transitions any label. The
    # dispatcher's schedule fallback (#15) re-labels tickets left that way.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.pick.outputs.index }}
    steps:
      - id: pick
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          SLOTS: ${{ inputs.per_account_slots }}
        run: |
          case "$SLOTS" in
            ''|*[!0-9]*|0) echo "per_account_slots must be a positive integer, got '$SLOTS'; using 3." >&2; SLOTS=3 ;;
          esac
          index=$(( NUMBER % SLOTS ))
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "Concurrency group account-slot-$index (number $NUMBER, $SLOTS slots per account)."

  implement-pr:
    # pull_request_target runs with secrets: never on a fork's code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: slot
    concurrency:
      group: account-slot-${{ needs.slot.outputs.index }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read # the linked ticket, its retry marker, and its labels
      pull-requests: write
      actions: read # the retry handler links the uploaded run log (#16)

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_OPEN: ${{ github.event.pull_request.state == 'open' }}
      # The push step puts FACTORY_PAT in front of it; the agent never sees the token.
      PUSH_URL: ${{ github.server_url }}/${{ github.repository }}.git

    steps:
      - name: Refuse closed PR
        if: env.PR_OPEN != 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run: PR #${PR_NUMBER} is not open."

      - name: Transition labels
        if: env.PR_OPEN == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Enumerate accounts
        # One secret per account, CLAUDE_CODE_OAUTH_TOKEN_<n>, labeled by the CLAUDE_ACCOUNT_<n> variable.
        # Every token is masked before anything else prints. The list goes to a file in RUNNER_TEMP for
        # the run script, which picks the account, deletes the file, and rotates once on a rate limit
        # (#17). Adding an account is adding one secret; nothing here changes.
        if: env.PR_OPEN == 'true'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$")) | .value' <<<"$SECRETS_JSON" \
            | while IFS= read -r token; do echo "::add-mask::$token"; done
          file="${RUNNER_TEMP}/factory-accounts.json"
          jq -n --argjson secrets "$SECRETS_JSON" --argjson vars "$VARS_JSON" '
            [ $secrets | to_entries[]
              | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$"))
              | (.key | sub("^CLAUDE_CODE_OAUTH_TOKEN_"; "") | tonumber) as $n
              | ($vars["CLAUDE_ACCOUNT_\($n)"] // "") as $label
              | { index: $n, label: (if ($label | length) > 0 then $label else "account-\($n)" end), token: .value } ]
            | sort_by(.index)' > "$file"
          chmod 600 "$file"
          count=$(jq 'length' "$file")
          if [ "$count" = "0" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN_<n> secret is available. Pass secrets: inherit from the caller." >&2
            exit 1
          fi
          echo "FACTORY_ACCOUNTS_FILE=$file" >> "$GITHUB_ENV"
          echo "$count account(s) configured: $(jq -r '[.[] | "\(.index) (\(.label))"] | join(", ")' "$file")"

      - name: Checkout PR branch
        if: env.PR_OPEN == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Checkout factory
        if: env.PR_OPEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Prepare branch
        if: env.PR_OPEN == 'true'
        working-directory: target
        run: |
          # fetch-depth 0 already brought origin/main; no credentials remain for a network fetch
          git branch -f main origin/main
          git checkout -B "$BRANCH" "$BRANCH_HEAD_SHA"
          git config user.name "factory-agent[bot]"
          git config user.email "factory-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js
        if: env.PR_OPEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install factory (pinned sandcastle, tsx, Claude Code)
        if: env.PR_OPEN == 'true'
        working-directory: factory
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "Claude Code $(node_modules/.bin/claude --version)"

      - name: Run implement-PR agent
        if: env.PR_OPEN == 'true'
        id: run
        working-directory: target
        env:
          IMPLEMENTER_MODEL: ${{ inputs.implementer_model }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
          FACTORY_FORCE_RATE_LIMIT_ON: ${{ vars.FACTORY_FORCE_RATE_LIMIT_ON }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tsx ../factory/factory/implement-pr/implement-pr.ts

      - name: Post usage comment
        # Token usage and wall time of every attempt in this job, one comment per role (#18).
        if: always() && env.PR_OPEN == 'true'
        run: bash factory/factory/shared/upsert-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/factory-out/usage-implementer.md"

      - name: Upload run log
        if: always() && env.PR_OPEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-implement-pr-${{ github.event.pull_request.number }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out/logs
          if-no-files-found: ignore

      - name: Push branch
        # refs/heads/$BRANCH, not HEAD: the branch the run collected commits on, whatever the agent left checked out.
        if: env.PR_OPEN == 'true' && success()
        working-directory: target
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
        run: |
          if [ "$(cat "${RUNNER_TEMP}/factory-out/has_commits.txt")" != "true" ]; then
            echo "No commits to push."
            exit 0
          fi
          if ! git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" "https://x-access-token:${FACTORY_PAT}@${PUSH_URL#*://}" "refs/heads/$BRANCH:refs/heads/$BRANCH" 2> push_err.txt; then
            cat push_err.txt
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement-PR run." > "${RUNNER_TEMP}/factory-out/failure_reason.txt"
            fi
            exit 1
          fi

      - name: Post thread replies
        if: env.PR_OPEN == 'true' && success()
        env:
          REPLIES: ${{ runner.temp }}/factory-out/implement_thread_replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Post inline comments
        if: env.PR_OPEN == 'true' && success()
        working-directory: target
        env:
          COMMENTS: ${{ runner.temp }}/factory-out/implement_new_inline_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          for i in $(seq 0 $((count - 1))); do
            path=$(jq -r ".[$i].path" "$COMMENTS")
            line=$(jq -r ".[$i].line" "$COMMENTS")
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments" \
              -f commit_id="$head_sha" \
              -f path="$path" \
              -F line="$line" \
              -f side="RIGHT" \
              -f body="$body"
          done

      - name: Post top-level comments
        if: env.PR_OPEN == 'true' && success()
        env:
          COMMENTS: ${{ runner.temp }}/factory-out/implement_top_level_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh pr comment "$PR_NUMBER" --body "$body"
          done

      - name: Request review
        # The factory's loop: every push is judged again. FACTORY_PAT so the label fires its event.
        if: env.PR_OPEN == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: gh pr edit "$PR_NUMBER" --add-label "agent:review"

      - name: Retry or escalate
        # One informed retry, then needs-human (#16), for a failure of the implementer itself. FACTORY_PAT so
        # the label that starts the retry fires its event. A failure elsewhere in the job (a push refused because
        # the branch moved, say), or a handler that cannot reach GitHub, gets the plain blocked comment.
        if: env.PR_OPEN == 'true' && failure()
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          FAILURE_KIND: implement
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: factory-implement-pr-${{ github.event.pull_request.number }}-run-${{ github.run_attempt }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
          IMPLEMENTER_OUTCOME: ${{ steps.run.outcome }}
        run: |
          if [ "$IMPLEMENTER_OUTCOME" = "failure" ] && factory/node_modules/.bin/tsx factory/factory/retry/retry.ts; then
            exit 0
          fi
          reason="(no reason file written; check workflow logs)"
          if [ -f "${OUTPUT_DIR}/failure_reason.txt" ]; then
            reason=$(cat "${OUTPUT_DIR}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` PR run failed outside the implementer, or the retry handler could not run.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove the accounts file
        if: always()
        run: rm -f "${RUNNER_TEMP}/factory-accounts.json"

      - name: Always remove in-progress
        if: always() && env.PR_OPEN == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
