# Reusable: run the implementer on an issue labeled agent:implement.
# Called from a target repo's thin factory workflow on `issues: labeled`.
# Vendored from sandcastle's agent-implement.yml (v0.12.0), edited for the factory.
name: factory implement

on:
  workflow_call:
    inputs:
      implementer_model:
        description: Default model for the implementer. A model:<name> label on the issue overrides it for that run.
        type: string
        default: claude-opus-5
      implementer_max_turns:
        description: Turn cap passed to the CLI as --max-turns. The 60 minute job timeout is the other bound.
        type: number
        default: 200
      per_account_slots:
        description: Runs in flight per account. Implemented as this many named concurrency slots; raise it here, no code change.
        type: number
        default: 3
      factory_repo:
        description: Repo holding the factory scripts (this repo).
        type: string
        default: chizhangucb/software-factory
      factory_ref:
        description: Ref of the factory scripts to run. Keep it equal to the ref in the caller's `uses:`; GitHub does not expose that ref to the called workflow.
        type: string
        default: main
    secrets:
      FACTORY_PAT:
        description: Personal access token used for pushes and PR creation so the target repo's CI fires.
        required: true
      # Account tokens are CLAUDE_CODE_OAUTH_TOKEN_<n>, discovered from the inherited secrets.

jobs:
  slot:
    # Per-account concurrency cap (#17): N named slots, account-slot-0 .. account-slot-(N-1), shared by
    # implement, review, and implement-pr in the target repo. A run takes slot (number mod N), so
    # every run on one issue or PR lands in the same slot and stays serialized. Runs fill accounts
    # in configured order and rotate only on a rate limit, so N slots caps runs in flight on the
    # account in use. GitHub's concurrency key has no arithmetic, hence this job.
    # Trade-off: a concurrency group holds one running and one pending run; a third run arriving
    # for the same slot cancels the older pending one before it transitions any label. The
    # dispatcher's schedule fallback (#15) re-labels tickets left that way.
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.pick.outputs.index }}
    steps:
      - id: pick
        env:
          NUMBER: ${{ github.event.issue.number }}
          SLOTS: ${{ inputs.per_account_slots }}
        run: |
          case "$SLOTS" in
            ''|*[!0-9]*|0) echo "per_account_slots must be a positive integer, got '$SLOTS'; using 3." >&2; SLOTS=3 ;;
          esac
          index=$(( NUMBER % SLOTS ))
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "Concurrency group account-slot-$index (number $NUMBER, $SLOTS slots per account)."

  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: slot
    concurrency:
      group: account-slot-${{ needs.slot.outputs.index }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Detect issue shape
        # A ticket is a sub-issue of its spec by design (ADR 0002), so being a
        # sub-issue is fine. Having sub-issues means the issue is a spec, refused.
        id: shape
        run: |
          set -euo pipefail
          sub_count=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/sub_issues" --jq 'length' 2>/dev/null || echo "0")
          if [ "$sub_count" != "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sub_count=$sub_count" >> "$GITHUB_OUTPUT"

      - name: Refuse PRD-shaped issue
        if: steps.shape.outputs.sub_count != '0'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: issue #${ISSUE_NUMBER} has sub-issues. The factory implements tickets, not specs."

      - name: Preflight existing PR
        if: steps.shape.outputs.proceed == 'true'
        id: preflight
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --state open \
            --search "in:body \"#${ISSUE_NUMBER}\"" \
            --json number,url,body,author \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves)\\\\s+#${ISSUE_NUMBER}\\\\b\"))]")
          count=$(echo "$existing" | jq 'length')
          refused=false
          existing_pr_url=""
          for i in $(seq 0 $((count - 1))); do
            author=$(echo "$existing" | jq -r ".[$i].author.login")
            # Only PRs from collaborators block the agent; outside contributors don't count.
            if gh api "repos/${GH_REPO}/collaborators/${author}" --silent 2>/dev/null; then
              refused=true
              existing_pr_url=$(echo "$existing" | jq -r ".[$i].url")
              break
            fi
          done
          echo "refused=$refused" >> "$GITHUB_OUTPUT"
          echo "existing_pr_url=$existing_pr_url" >> "$GITHUB_OUTPUT"

      - name: Refuse existing PR
        if: steps.preflight.outputs.refused == 'true'
        env:
          EXISTING_PR_URL: ${{ steps.preflight.outputs.existing_pr_url }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: $EXISTING_PR_URL already targets this issue. Close it first, then re-add \`agent:implement\`."

      - name: Transition labels
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Enumerate accounts
        # One secret per account, CLAUDE_CODE_OAUTH_TOKEN_<n>, labeled by the CLAUDE_ACCOUNT_<n> variable.
        # Every token is masked before anything else prints. The list goes to a file in RUNNER_TEMP for
        # the run script, which picks the account, deletes the file, and rotates once on a rate limit
        # (#17). Adding an account is adding one secret; nothing here changes.
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$")) | .value' <<<"$SECRETS_JSON" \
            | while IFS= read -r token; do echo "::add-mask::$token"; done
          file="${RUNNER_TEMP}/factory-accounts.json"
          jq -n --argjson secrets "$SECRETS_JSON" --argjson vars "$VARS_JSON" '
            [ $secrets | to_entries[]
              | select(.key | test("^CLAUDE_CODE_OAUTH_TOKEN_[1-9][0-9]*$"))
              | (.key | sub("^CLAUDE_CODE_OAUTH_TOKEN_"; "") | tonumber) as $n
              | ($vars["CLAUDE_ACCOUNT_\($n)"] // "") as $label
              | { index: $n, label: (if ($label | length) > 0 then $label else "account-\($n)" end), token: .value } ]
            | sort_by(.index)' > "$file"
          chmod 600 "$file"
          count=$(jq 'length' "$file")
          if [ "$count" = "0" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN_<n> secret is available. Pass secrets: inherit from the caller." >&2
            exit 1
          fi
          echo "FACTORY_ACCOUNTS_FILE=$file" >> "$GITHUB_ENV"
          echo "$count account(s) configured: $(jq -r '[.[] | "\(.index) (\(.label))"] | join(", ")' "$file")"

      - name: Checkout target repo
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Checkout factory
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: factory
          token: ${{ secrets.FACTORY_PAT }}
          persist-credentials: false

      - name: Compute branch name
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        id: branch
        run: |
          slug=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          branch="agent/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "factory-agent[bot]"
          git config user.email "factory-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Setup Node.js
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install factory (pinned sandcastle, tsx, Claude Code)
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        working-directory: factory
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "Claude Code $(node_modules/.bin/claude --version)"

      - name: Run implementer
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          IMPLEMENTER_MODEL: ${{ inputs.implementer_model }}
          IMPLEMENTER_MAX_TURNS: ${{ inputs.implementer_max_turns }}
          OUTPUT_DIR: ${{ runner.temp }}/factory-out
          FACTORY_FORCE_RATE_LIMIT_ON: ${{ vars.FACTORY_FORCE_RATE_LIMIT_ON }}
        run: tsx ../factory/factory/implement/implement.ts

      - name: Upload run log
        if: always() && steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-implement-issue-${{ github.event.issue.number }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-out/logs
          if-no-files-found: ignore

      - name: Push branch
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
        run: git push --force "https://x-access-token:${FACTORY_PAT}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open draft PR
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        id: open_pr
        working-directory: target
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          title="${title:0:256}"
          body_file="${RUNNER_TEMP}/pr-body.md"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Implemented by the software factory. Run: ${RUN_URL}"
          } > "$body_file"
          pr_url=$(gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file "$body_file" | tail -n1)
          echo "pr_number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url"

      - name: Request review
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: gh pr edit "$PR_NUMBER" --add-label "agent:review"

      - name: Mark blocked on failure
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/factory-out/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/factory-out/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"

      - name: Always remove the accounts file
        if: always()
        run: rm -f "${RUNNER_TEMP}/factory-accounts.json"

      - name: Always remove in-progress
        if: always() && steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
