# Copy to .github/workflows/factory.yml in the target repo. This is the only factory file a target carries.
name: factory

on:
  issues:
    types: [closed, labeled]
  pull_request_target:
    types: [labeled, ready_for_review]
  pull_request:
  push:
    branches: [main] # update-branch: bring stale auto-merge PRs up to date when main moves
  schedule:
    # Dispatcher fallback for missed events. Each run bills a minute on a private repo.
    # Off the :00 slots; GitHub delays crons on busy minutes.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write # factory/verdict, factory/red-green, factory/test-integrity

jobs:
  dispatch:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (github.event.action == 'closed' || github.event.label.name == 'ready-for-agent'))
    uses: chizhangucb/software-factory/.github/workflows/dispatch.yml@main
    secrets: inherit
  implement:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:implement'
    uses: chizhangucb/software-factory/.github/workflows/implement.yml@main
    secrets: inherit
    # Optional, same on every job: raise the per-account concurrency cap (default 3).
    # with:
    #   per_account_slots: 5
  review:
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'agent:review'
    uses: chizhangucb/software-factory/.github/workflows/review.yml@main
    secrets: inherit
  implement-pr:
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'agent:implement'
    uses: chizhangucb/software-factory/.github/workflows/implement-pr.yml@main
    secrets: inherit
  gate:
    if: github.event_name == 'pull_request'
    uses: chizhangucb/software-factory/.github/workflows/gate.yml@main
    secrets: inherit
  update-branch:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' && github.event.action == 'ready_for_review')
    uses: chizhangucb/software-factory/.github/workflows/update-branch.yml@main
    secrets: inherit
