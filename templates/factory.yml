# Copy to .github/workflows/factory.yml in the target repo. This is the only factory file a target carries.
# factory_ref must equal the ref in each `uses:` (the scripts are checked out at factory_ref; GitHub does
# not tell a cross-repo reusable workflow which ref it came from). Change both together.
name: factory

on:
  issues:
    types: [closed, labeled]
  pull_request_target:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, closed] # closed: the first-20 audit on merged factory PRs
  push:
    branches: [main] # update-branch: bring stale auto-merge PRs up to date when main moves
  repository_dispatch:
    # factory-update-branch: sent by the review workflow on a passing verdict.
    # factory-sweep: the dispatcher's sweep, from outside GitHub when its cron does not fire:
    #   gh api repos/<owner>/<repo>/dispatches -f event_type=factory-sweep
    types: [factory-update-branch, factory-sweep]
  schedule:
    # Dispatcher and reconciler sweep, the fallback for missed events. Each run bills a minute on
    # a private repo. Off the :00 slots; GitHub delays crons on busy minutes, and on some accounts
    # skips them for hours: a cron on any machine can send the factory-sweep dispatch above.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write # factory/verdict, factory/red-green, factory/test-integrity
  checks: read # retry handler: the head's check runs
  actions: read # retry handler: failing runs' logs and artifacts

jobs:
  dispatch:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'factory-sweep') ||
      (github.event_name == 'issues' && (github.event.action == 'closed' || github.event.label.name == 'ready-for-agent'))
    uses: chizhangucb/software-factory/.github/workflows/dispatch.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # Optional: whose tickets run, by GitHub author_association (default OWNER).
      # A ticket body is what the implementer executes, and on a public repo anyone
      # can open an issue. Widen only to people who could already push.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
      # Optional: the reconciler's deadlines in minutes (defaults 15, 30, 30).
      # stuck_minutes: 15
      # verdict_minutes: 30
      # update_minutes: 30
  implement:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:implement'
    uses: chizhangucb/software-factory/.github/workflows/agent-implement.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # Optional, on implement, implement-pr, review, gate and audit: the Node the target's
      # own tests and tooling need (default "22"). Set it on every one of those jobs.
      # node_version: "24"
      # Optional: whose words the implementer acts on. Keep it equal to the dispatch job's,
      # or a trusted author's ticket is dispatched and their comments are then dropped.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
      # Optional, on implement, implement-pr, review and audit: runs in flight
      # per account (default 5). Only those four run a model, so only those four
      # take it; setting it on dispatch, gate or update-branch fails the whole
      # factory workflow at parse time. Set the same number on all four: the slot
      # group is the issue or PR number mod this, so four roles on two different
      # numbers stop sharing a group and the cap stops capping.
      # Runs fill accounts in order and rotate only on a rate limit, so this is
      # how many run at once on the account in use, not a spread across accounts.
      # Raise it to leave less quota idle; lower it to be gentler on one account.
      # per_account_slots: 8
  review:
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'agent:review'
    uses: chizhangucb/software-factory/.github/workflows/agent-review.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # node_version: "24"
      # Optional: whose words the reviewer reads, on the PR and on the linked ticket.
      # Set it on every job that takes it (dispatch, implement, review, implement-pr,
      # audit), or the factory reads a stranger on one path and not another.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
      # per_account_slots: 8
  implement-pr:
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'agent:implement'
    uses: chizhangucb/software-factory/.github/workflows/agent-implement-pr.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # node_version: "24"
      # Optional: whose words this run reads, the factory's own retry marker included.
      # Keep it equal to the implement job's, or a retry loses its failure context.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
      # per_account_slots: 8
  gate:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: chizhangucb/software-factory/.github/workflows/gate.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # node_version: "24"
  audit:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
    uses: chizhangucb/software-factory/.github/workflows/agent-audit.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # node_version: "24"
      # Optional: whose words the audit reads, on the PR and on the linked ticket.
      # trusted_author_associations: OWNER,MEMBER,COLLABORATOR
      # per_account_slots: 8
      # Optional: the strongest model the subscription serves (see docs/pipeline.md, Audit).
      # audit_model: claude-fable-5-1
  update-branch:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'factory-update-branch')
    uses: chizhangucb/software-factory/.github/workflows/update-branch.yml@main
    secrets: inherit
    with:
      factory_ref: main
